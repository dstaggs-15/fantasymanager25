<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORP & Player Analysis - Fantasy Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main>
            <h1>VORP & Player Analysis</h1>
            <p>Value Over Replacement Player (VORP) measures a player's value relative to a baseline "replacement-level" player at the same position. Higher VORP indicates a greater positional advantage. Click any column header to sort the data.</p>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="player_name">Player</th>
                            <th data-sort="position">Pos</th>
                            <th data-sort="team">Team</th>
                            <th data-sort="ppg">PPG</th>
                            <th data-sort="std_dev">Std Dev</th>
                            <th data-sort="vorp">VORP</th>
                        </tr>
                    </thead>
                    <tbody id="vorp-table-body">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="vorp.js" defer></script>
</body>
</html>
