<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consistency Ratings - Fantasy Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main>
            <h1>Consistency Ratings</h1>
            <p>Analyze player volatility to understand their weekly floor and ceiling. A lower Standard Deviation (Std Dev) indicates a more consistent player. Click any column header to sort the data.</p>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="player_name">Player</th>
                            <th data-sort="position">Pos</th>
                            <th data-sort="team">Team</th>
                            <th data-sort="ppg">PPG</th>
                            <th data-sort="std_dev">Std Dev</th>
                            <th data-sort="ceiling">Ceiling</th>
                            <th data-sort="floor">Floor</th>
                            <th data-sort="good_pct">Good %</th>
                            <th data-sort="bust_pct">Bust %</th>
                        </tr>
                    </thead>
                    <tbody id="consistency-table-body">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="consistency.js" defer></script>
</body>
</html>
