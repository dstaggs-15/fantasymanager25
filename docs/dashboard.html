<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }
        .dashboard-card {
            background-color: var(--color-surface);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--box-shadow);
            border: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .card-header h3 { margin-bottom: 0; }
        .chart-container {
            position: relative;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-header">
                    <h3>This Week - Top 10</h3>
                    <select id="top-10-pos-filter" class="btn">
                        <option value="RB">RB</option>
                        <option value="WR">WR</option>
                        <option value="QB">QB</option>
                        <option value="TE">TE</option>
                    </select>
                </div>
                <div class="chart-container">
                    <canvas id="top-10-chart"></canvas>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <h3>Team Points Share</h3>
                    <select id="team-share-filter" class="btn"></select>
                </div>
                <div class="chart-container">
                    <canvas id="team-share-chart"></canvas>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <h3>Consistency vs. Production</h3>
                     <select id="consistency-pos-filter" class="btn">
                        <option value="ALL">ALL</option>
                        <option value="RB">RB</option>
                        <option value="WR">WR</option>
                        <option value="QB">QB</option>
                        <option value="TE">TE</option>
                    </select>
                </div>
                <div class="chart-container">
                    <canvas id="consistency-chart"></canvas>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <h3>Player Trend (Last 8 Games)</h3>
                    <input type="text" id="player-trend-search" list="player-list" placeholder="Search for player...">
                </div>
                 <datalist id="player-list"></datalist>
                <div class="chart-container">
                    <canvas id="player-trend-chart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
