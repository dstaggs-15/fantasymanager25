<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .trade-side .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .trade-side .search-group { flex-grow: 1; }
        .player-chip { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 0.5rem; border: 1px solid var(--color-border); color: white; font-weight: 500;}
        .player-chip button { background: none; border: none; color: white; opacity: 0.7; font-size: 1.2rem; cursor: pointer; transition: opacity 0.2s; }
        .player-chip button:hover { opacity: 1; }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; align-items: center;}
        .result-box { text-align: center; }
        .result-box h4 { color: var(--color-text-secondary); margin-bottom: 0.5rem; }
        .result-box .value { font-size: 2rem; font-weight: 700; }
        .result-box .grade { font-size: 3rem; font-weight: 700; color: var(--color-primary); }
        details { border: 1px solid var(--color-border); border-radius: var(--border-radius); padding: 1rem; margin-bottom: 1rem; }
        summary { font-weight: 600; cursor: pointer; color: var(--color-primary); font-size: 1.25rem; }
        .explanation-content { margin-top: 1.5rem; }
        .player-stats-table { width: 100%; margin-top: 1.5rem; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trade Analyzer</h1>
        <div class="card" style="margin-bottom: 2rem;">
            <details>
                </details>
        </div>

        <div class="trade-grid">
            <div class="card trade-side" id="side-a">
                <h2>Team A Receives</h2>
                <div class="card-header">
                    <div class="search-group"><input type="text" id="player-search-a" list="player-list" placeholder="Search..."></div>
                    <button id="add-player-a" class="btn">Add</button>
                </div>
                <div id="players-a-container"></div>
            </div>

            <div class="card trade-side" id="side-b">
                <h2>Team B Receives</h2>
                <div class="card-header">
                    <div class="search-group"><input type="text" id="player-search-b" list="player-list" placeholder="Search..."></div>
                    <button id="add-player-b" class="btn">Add</button>
                </div>
                <div id="players-b-container"></div>
            </div>
        </div>

        <datalist id="player-list"></datalist>

        <div class="card" style="margin-top: 2rem;">
            <h2>Trade Results</h2>
            <div class="results-grid">
                <div class="result-box"><h4>Team A Grade</h4><p id="grade-a" class="grade">-</p></div>
                <div class="result-box"><h4>Team B Grade</h4><p id="grade-b" class="grade">-</p></div>
                <div class="result-box"><h4>VORP Total</h4><p id="vorp-a" class="value">0.0</p></div>
                <div class="result-box"><h4>VORP Total</h4><p id="vorp-b" class="value">0.0</p></div>
                <div class="result-box"><h4>Start Score Total</h4><p id="start-score-a" class="value">0.0</p></div>
                <div class="result-box"><h4>Start Score Total</h4><p id="start-score-b" class="value">0.0</p></div>
            </div>
            <div style="margin-top: 2rem; height: 250px;">
                <canvas id="trade-chart"></canvas>
            </div>
            <div id="player-stats-container" style="margin-top: 2rem;"></div>
        </div>
    </div>

    <script src="trade-analyzer.js"></script>
</body>
</html>
