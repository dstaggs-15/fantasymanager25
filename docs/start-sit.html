<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start/Sit Assistant - Fantasy Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main>
            <h1>Start/Sit Assistant</h1>
            <p>Search for up to three players to compare their 4-Factor Start Score for the upcoming week.</p>
            
            <div class="card">
                <h3>Compare Players</h3>
                <div id="search-area" class="start-sit-search">
                    <div class="search-group">
                        <label for="player-1">Player 1</label>
                        <input type="text" id="player-1" list="player-list" class="player-search-input" placeholder="Search...">
                    </div>
                    <div class="search-group">
                        <label for="player-2">Player 2</label>
                        <input type="text" id="player-2" list="player-list" class="player-search-input" placeholder="Search...">
                    </div>
                    <div class="search-group">
                        <label for="player-3">Player 3 (Optional)</label>
                        <input type="text" id="player-3" list="player-list" class="player-search-input" placeholder="Search...">
                    </div>
                    <button id="analyze-btn" class="btn">Analyze</button>
                </div>
            </div>

            <datalist id="player-list"></datalist>

            <div id="results-area" class="results-grid">
                </div>
        </main>
    </div>
    <script src="start-sit.js" defer></script>
</body>
</html>
