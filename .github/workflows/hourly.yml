# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *' # Runs daily at 10:00 AM UTC
  workflow_dispatch: # Allows manual runs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Step A - Get Raw NFL Data
        run: python pipeline/get_raw_data.py
      
      - name: Run Step B - Calculate Fantasy Points
        run: python pipeline/calculate_fantasy_points.py

      - name: Commit Data Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Data Update: Refresh raw and processed NFL data"
          file_pattern: 'docs/data/raw/*.csv docs/data/processed/*.csv'
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
