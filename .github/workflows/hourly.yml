# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # NEW: Install Google Chrome for Selenium
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Step A1 - Get Raw NFL Data
        run: python pipeline/get_raw_data.py
      
      - name: Run Step A2 - Scrape O-Line Rankings
        run: python pipeline/get_oline_rankings.py
      
      - name: Verify Data Files
        run: |
          if [ ! -f docs/data/raw/players_master.csv ]; then echo "CRITICAL ERROR: players_master.csv was not created."; exit 1; fi
          if [ ! -f docs/data/raw/oline_rankings.csv ]; then echo "CRITICAL ERROR: oline_rankings.csv was not created."; exit 1; fi
      
      - name: Run Step B - Calculate Fantasy Points
        run: python pipeline/calculate_fantasy_points.py

      - name: Run Analysis Scripts
        run: |
          python analysis/vorp_analyzer.py
          python analysis/matchup_analyzer.py
          python analysis/consistency_analyzer.py
          python analysis/composite_score_generator.py

      - name: Commit Data Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Data Update: Refresh data and generate new reports"
          file_pattern: 'docs/data/raw/*.csv docs/data/processed/*.csv docs/data/reports/*.json'
          commit_user_name: "GitHub Actions Bot"
