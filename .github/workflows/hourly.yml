# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Get Latest NFL Data
        run: python pipeline/get_nfl_data.py
      
      # --- NEW DIAGNOSTIC STEP ---
      - name: List files after data collection
        run: ls -R docs/data

      - name: Calculate Player PPG for VORP
        run: python analysis/vorp_calculator.py

      # --- NEW DIAGNOSTIC STEP ---
      - name: List files after PPG calculation
        run: ls -R docs/data

      - name: Commit Data Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Data Update: Refresh NFL player and analysis data"
          file_pattern: 'docs/data/*.csv docs/data/analysis/*.json'
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
