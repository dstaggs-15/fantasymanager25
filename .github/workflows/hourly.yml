name: Fantasy Football Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- SCRIPT EXECUTION IN CORRECT ORDER ---

      - name: 4. Run -> Get Raw Data
        run: python pipeline/get_raw_data.py

      - name: 5. Run -> Calculate Fantasy Points
        run: python pipeline/calculate_fantasy_points.py

      - name: 6. Run -> Generate O-Line Rankings
        run: python analysis/generate_oline_rankings.py

      - name: 7. Run -> Generate ROS Projections
        run: python analysis/generate_ros_projections.py

      - name: 8. Run -> VORP Analysis
        run: python analysis/vorp_analyzer.py

      - name: 9. Run -> Consistency Analysis
        run: python analysis/consistency_analyzer.py
        
      - name: 10. Run -> Matchup Analysis
        run: python analysis/matchup_analyzer.py

      - name: 11. Run -> Generate 'Start Scores'
        run: python analysis/composite_score_generator.py

      - name: 12. Run -> Generate 'Trade Values' (FINAL SCRIPT)
        run: python analysis/trade_analyzer_engine.py

      # --- COMMIT DATA BACK TO REPO ---
      
      - name: 13. Commit and push data files
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "📊 Automated daily data and report update" || echo "No changes to commit"
          git push
