# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *' # Runs daily at 10:00 UTC
  workflow_dispatch: # Allows manual runs from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # REQUIRED: Add write permissions for the job to push changes back to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Collection
        run: python pipeline/get_raw_data.py
      
      - name: Run All Analysis Scripts
        run: |
          python analysis/generate_oline_rankings.py
          python analysis/generate_ros_projections.py
          python pipeline/calculate_fantasy_points.py
          python analysis/vorp_analyzer.py
          python analysis/matchup_analyzer.py
          python analysis/consistency_analyzer.py
          python analysis/composite_score_generator.py
          python analysis/trade_analyzer_engine.py
      
      # CORRECTED: Final step to commit the generated data files
      - name: Commit and Push Data Files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # CORRECTED: Use the correct paths for the data directories
          git add data/raw/*.csv data/processed/*.csv data/reports/*.json
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Data Update: Refresh data and generate new reports"
          git pull --rebase
          git push
