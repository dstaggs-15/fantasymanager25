# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Collection
        run: python pipeline/get_raw_data.py
      
      - name: Run All Analysis Scripts
        run: |
          python analysis/generate_oline_rankings.py
          python analysis/generate_ros_projections.py
          python pipeline/calculate_fantasy_points.py
          python analysis/vorp_analyzer.py
          python analysis/matchup_analyzer.py
          python analysis/consistency_analyzer.py
          python analysis/composite_score_generator.py
          python analysis/trade_analyzer_engine.py
      
      - name: Commit and Push Data Files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/data/raw/*.csv docs/data/processed/*.csv docs/data/reports/*.json
          git commit -m "📊 Data Update: Refresh data and generate new reports" || echo "No changes to commit"
          git pull --rebase
          git push
