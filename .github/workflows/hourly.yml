# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Collection Scripts
        run: |
          python pipeline/get_raw_data.py
          python pipeline/get_oline_rankings.py
          python pipeline/get_ros_projections.py # NEW SCRIPT
      
      - name: Run Analysis Scripts
        run: |
          python pipeline/calculate_fantasy_points.py
          # ... other analysis scripts will go here later ...

      - name: Commit Data Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Data Update: Refresh data and generate new reports"
          file_pattern: 'docs/data/raw/*.csv docs/data/processed/*.csv docs/data/reports/*.json'
          commit_user_name: "GitHub Actions Bot"
