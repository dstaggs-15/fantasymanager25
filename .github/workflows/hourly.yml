# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # We need to fetch all history for git pull to work correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Collection & Analysis
        run: |
          python pipeline/get_raw_data.py
          python pipeline/get_oline_rankings.py
          python pipeline/calculate_fantasy_points.py
          python analysis/vorp_analyzer.py
          python analysis/matchup_analyzer.py
          python analysis/consistency_analyzer.py
          python analysis/composite_score_generator.py
      
      # --- NEW STEP TO PREVENT PUSH ERRORS ---
      - name: Sync with Remote Branch
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git pull --rebase
      
      - name: Commit Data Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Data Update: Refresh data and generate new reports"
          file_pattern: 'docs/data/raw/*.csv docs/data/processed/*.csv docs/data/reports/*.json'
