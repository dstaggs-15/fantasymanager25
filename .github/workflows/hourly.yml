# .github/workflows/main_pipeline.yml

name: Fantasy Football Data Pipeline

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Step A1 - Get Raw NFL Data
        run: python pipeline/get_raw_data.py
      
      - name: Run Step A2 - Scrape O-Line Rankings
        run: python pipeline/get_oline_rankings.py
      
      # --- NEW: Verify O-Line file was created ---
      - name: Verify O-Line File Creation
        run: |
          if [ ! -f docs/data/raw/oline_rankings.csv ]; then
            echo "CRITICAL ERROR: oline_rankings.csv was not created by the scraper."
            exit 1
          fi
          echo "oline_rankings.csv created successfully."
      
      - name: Run Step B - Calculate Fantasy Points
        run: python pipeline/calculate_fantasy_points.py

      - name: Run Step C - VORP & Consistency Analysis
        run: python analysis/vorp_analyzer.py

      - name: Run Step D - Matchup Analysis
        run: python analysis/matchup_analyzer.py
      
      - name: Run Step E - Consistency Analysis
        run: python analysis/consistency_analyzer.py

      - name: Run Step F - Generate Composite Start Scores
        run: python analysis/composite_score_generator.py

      - name: Commit Data Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Data Update: Refresh data and generate new reports"
          file_pattern: 'docs/data/raw/*.csv docs/data/processed/*.csv docs/data/reports/*.json'
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
